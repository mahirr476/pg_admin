# ========================================
# OPTIMIZED PRODUCTION DEPLOYMENT.YAML
# Global Admin Panel with API Management
# ========================================

# ConfigMap for environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-admin-config
  namespace: default
data:
  NODE_ENV: "production"
  PORT: "7000"
  CLIENT_PORT: "3000"
  API_VERSION: "v1"
  CORS_ORIGINS: "https://site1.example.com,https://site2.example.com,http://pg-admin.4.144.195.246.nip.io"
  RATE_LIMIT_WINDOW: "900000"  # 15 minutes
  RATE_LIMIT_MAX: "100"        # 100 requests per window
  LOG_LEVEL: "info"
  HEALTH_CHECK_INTERVAL: "30000"

---
# Secrets for production security
apiVersion: v1
kind: Secret
metadata:
  name: pg-admin-secrets
  namespace: default
type: Opaque
stringData:
  jwt-secret: "paragon-admin-secret-production-2025"
  database-url-global: "postgresql://pgwebadmin:Pg%40Admin2025%21@pgwebpostgresql.postgres.database.azure.com:5432/globaladmin?sslmode=require"
  database-url-group: "postgresql://pgwebadmin:Pg%40Admin2025%21@pgwebpostgresql.postgres.database.azure.com:5432/groupdb?sslmode=require"
  database-url-parasole: "postgresql://pgwebadmin:Pg%40Admin2025%21@pgwebpostgresql.postgres.database.azure.com:5432/parasoledb?sslmode=require"
  # API tokens for external sites
  site1-api-token: "site1-secure-token-2025"
  site2-api-token: "site2-secure-token-2025"
  # External site API URLs and tokens
  site1-webhook-secret: "site1-webhook-secret"
  site2-webhook-secret: "site2-webhook-secret"

---
# ========================================
# BACKEND API SERVER DEPLOYMENT
# ========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-admin-server
  namespace: default
  labels:
    app: pg-admin-server
    tier: backend
    version: v1
spec:
  replicas: 3  # Increased for high availability
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: pg-admin-server
  template:
    metadata:
      labels:
        app: pg-admin-server
        tier: backend
        version: v1
    spec:
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: server
        image: node:18-alpine
        imagePullPolicy: Always
        workingDir: /app
        ports:
        - containerPort: 7000
          name: http
          protocol: TCP
        
        # Environment variables from ConfigMap and Secrets
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: pg-admin-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: pg-admin-config
              key: PORT
        - name: API_VERSION
          valueFrom:
            configMapKeyRef:
              name: pg-admin-config
              key: API_VERSION
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: pg-admin-config
              key: CORS_ORIGINS
        - name: RATE_LIMIT_WINDOW
          valueFrom:
            configMapKeyRef:
              name: pg-admin-config
              key: RATE_LIMIT_WINDOW
        - name: RATE_LIMIT_MAX
          valueFrom:
            configMapKeyRef:
              name: pg-admin-config
              key: RATE_LIMIT_MAX
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: pg-admin-config
              key: LOG_LEVEL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: pg-admin-secrets
              key: jwt-secret
        - name: DATABASE_URL_GLOBAL
          valueFrom:
            secretKeyRef:
              name: pg-admin-secrets
              key: database-url-global
        - name: DATABASE_URL_GROUP
          valueFrom:
            secretKeyRef:
              name: pg-admin-secrets
              key: database-url-group
        - name: DATABASE_URL_PARASOLE
          valueFrom:
            secretKeyRef:
              name: pg-admin-secrets
              key: database-url-parasole
        - name: SITE1_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: pg-admin-secrets
              key: site1-api-token
        - name: SITE2_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: pg-admin-secrets
              key: site2-api-token
        
        # Startup command with optimizations
        command: ["/bin/sh"]
        args:
          - -c
          - |
            echo "=== STARTING OPTIMIZED PRODUCTION SERVER ==="
            
            # Install system dependencies
            apk add --no-cache git openssl openssl-dev curl jq
            
            # Clone repository
            git clone --single-branch --branch 40/review-and-update-for-all-panel --depth 1 https://github.com/mahirr476/pg_admin.git .
            cd pg_admin/server
            
            echo "=== INSTALLING PRODUCTION DEPENDENCIES ==="
            # Use npm ci for faster, reliable installs
            npm ci --only=production --ignore-scripts
            
            echo "=== GENERATING PRISMA CLIENTS ==="
            # Generate all Prisma clients
            for schema in prisma/*/schema.prisma; do
              if [ -f "$schema" ]; then
                echo "Generating client for $schema"
                npx prisma generate --schema="$schema" || echo "Failed to generate $schema"
              fi
            done
            
            echo "=== RUNNING DATABASE MIGRATIONS ==="
            # Run migrations for all databases
            for schema in prisma/*/schema.prisma; do
              if [ -f "$schema" ]; then
                echo "Running migrations for $schema"
                npx prisma migrate deploy --schema="$schema" || echo "Migration failed for $schema"
              fi
            done
            
            echo "=== OPTIMIZING NODE.JS ==="
            # Node.js optimizations
            export NODE_OPTIONS="--max-old-space-size=1536 --optimize-for-size"
            
            echo "=== STARTING PRODUCTION SERVER ==="
            npm run start || npm run dev
        
        # Resource management
        resources:
          requests:
            memory: "1.5Gi"
            cpu: "750m"
          limits:
            memory: "2.5Gi"
            cpu: "1500m"
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /api/health
            port: 7000
            httpHeaders:
            - name: Accept
              value: application/json
          initialDelaySeconds: 90
          timeoutSeconds: 10
          periodSeconds: 30
          failureThreshold: 3
          successThreshold: 1
        
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 7000
            httpHeaders:
            - name: Accept
              value: application/json
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        
        # Startup probe for slow initialization
        startupProbe:
          httpGet:
            path: /api/health
            port: 7000
          initialDelaySeconds: 30
          timeoutSeconds: 10
          periodSeconds: 10
          failureThreshold: 12  # Allow up to 2 minutes for startup

---
# ========================================
# FRONTEND CLIENT DEPLOYMENT
# ========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-admin-client
  namespace: default
  labels:
    app: pg-admin-client
    tier: frontend
    version: v1
spec:
  replicas: 2  # Frontend replicas
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Ensure zero downtime
  selector:
    matchLabels:
      app: pg-admin-client
  template:
    metadata:
      labels:
        app: pg-admin-client
        tier: frontend
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: client
        image: node:18-alpine
        imagePullPolicy: Always
        workingDir: /app
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: pg-admin-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: pg-admin-config
              key: CLIENT_PORT
        - name: NEXT_PUBLIC_API_URL
          value: "http://pg-admin-server-service:7000"
        - name: NEXT_PUBLIC_API_VERSION
          valueFrom:
            configMapKeyRef:
              name: pg-admin-config
              key: API_VERSION
        
        command: ["/bin/sh"]
        args:
          - -c
          - |
            echo "=== STARTING OPTIMIZED PRODUCTION CLIENT ==="
            
            # Install system dependencies
            apk add --no-cache git openssl openssl-dev curl
            
            # Clone repository
            git clone --single-branch --branch 40/review-and-update-for-all-panel --depth 1 https://github.com/mahirr476/pg_admin.git .
            cd pg_admin/client
            
            # Clean environment files
            rm -f .env*
            
            # Create optimized production environment
            cat > .env.production << EOF
            NODE_ENV=production
            NEXT_PUBLIC_API_URL=http://pg-admin-server-service:7000
            NEXT_PUBLIC_API_VERSION=v1
            NEXT_TELEMETRY_DISABLED=1
            EOF
            
            echo "=== PRODUCTION ENVIRONMENT ==="
            cat .env.production
            
            echo "=== INSTALLING PRODUCTION DEPENDENCIES ==="
            npm ci --legacy-peer-deps --ignore-scripts
            
            echo "=== FIXING API ENDPOINTS ==="
            # Replace all localhost references with service name
            find . -type f \( -name "*.tsx" -o -name "*.ts" -o -name "*.js" -o -name "*.jsx" \) \
              -not -path "./node_modules/*" \
              -not -path "./.next/*" \
              -exec grep -l "localhost:7000\|127.0.0.1:7000" {} \; | while read file; do
              echo "Updating API endpoints in: $file"
              sed -i 's|https\?://localhost:7000|http://pg-admin-server-service:7000|g' "$file"
              sed -i 's|https\?://127.0.0.1:7000|http://pg-admin-server-service:7000|g' "$file"
            done
            
            echo "=== BUILDING PRODUCTION CLIENT ==="
            # Try to build for production first, fallback to dev
            if npm run build; then
              echo "=== STARTING PRODUCTION CLIENT ==="
              npm run start
            else
              echo "=== BUILD FAILED, STARTING DEV MODE ==="
              npm run dev
            fi
        
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 60
          timeoutSeconds: 10
          periodSeconds: 30
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        
        startupProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10
          periodSeconds: 10
          failureThreshold: 18  # Allow up to 3 minutes for Next.js startup

---
# ========================================
# SERVICES CONFIGURATION
# ========================================

# Internal ClusterIP service for backend
apiVersion: v1
kind: Service
metadata:
  name: pg-admin-server-service
  namespace: default
  labels:
    app: pg-admin-server
    tier: backend
spec:
  selector:
    app: pg-admin-server
  ports:
  - port: 7000
    targetPort: 7000
    protocol: TCP
    name: http
  type: ClusterIP
  sessionAffinity: ClientIP  # Sticky sessions for API consistency

---
# Internal ClusterIP service for frontend
apiVersion: v1
kind: Service
metadata:
  name: pg-admin-client-service
  namespace: default
  labels:
    app: pg-admin-client
    tier: frontend
spec:
  selector:
    app: pg-admin-client
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  type: ClusterIP

---
# External LoadBalancer for public client access
apiVersion: v1
kind: Service
metadata:
  name: pg-admin-external
  namespace: default
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /
    service.beta.kubernetes.io/azure-load-balancer-health-probe-interval: "10"
    service.beta.kubernetes.io/azure-load-balancer-health-probe-num-of-probe: "3"
  labels:
    app: pg-admin-client
    tier: frontend
spec:
  selector:
    app: pg-admin-client
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  type: LoadBalancer
  loadBalancerIP: "4.144.195.246"  # Your current IP
  externalTrafficPolicy: Local  # Better performance

---
# External LoadBalancer for API access (for external sites)
apiVersion: v1
kind: Service
metadata:
  name: pg-admin-api-external
  namespace: default
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /api/health
    service.beta.kubernetes.io/azure-load-balancer-health-probe-interval: "10"
    service.beta.kubernetes.io/azure-load-balancer-health-probe-num-of-probe: "3"
  labels:
    app: pg-admin-server
    tier: backend
spec:
  selector:
    app: pg-admin-server
  ports:
  - port: 7000
    targetPort: 7000
    protocol: TCP
    name: http
  type: LoadBalancer
  loadBalancerIP: "20.212.138.160"  # Your current API IP
  externalTrafficPolicy: Local

---
# ========================================
# HORIZONTAL POD AUTOSCALER
# ========================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pg-admin-server-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pg-admin-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pg-admin-client-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pg-admin-client
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 300
    scaleDown:
      stabilizationWindowSeconds: 600







      

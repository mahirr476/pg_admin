#  a hybrid approach - run the server in production mode (which works) and the client in development mode
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-admin-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-admin-server
  template:
    metadata:
      labels:
        app: pg-admin-server
    spec:
      containers:
      - name: server
        image: node:18-alpine
        workingDir: /app
        ports:
        - containerPort: 7000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "7000"
        - name: JWT_SECRET
          value: "paragon-admin-secret"
        - name: DATABASE_URL_GLOBAL
          value: "postgresql://pgwebadmin:Pg%40Admin2025%21@pgwebpostgresql.postgres.database.azure.com:5432/globaladmin?sslmode=require"
        - name: DATABASE_URL_GROUP
          value: "postgresql://pgwebadmin:Pg%40Admin2025%21@pgwebpostgresql.postgres.database.azure.com:5432/groupdb?sslmode=require"
        - name: DATABASE_URL_PARASOLE
          value: "postgresql://pgwebadmin:Pg%40Admin2025%21@pgwebpostgresql.postgres.database.azure.com:5432/parasoledb?sslmode=require"
        command: ["/bin/sh"]
        args:
          - -c
          - |
            echo "=== STARTING SERVER DEPLOYMENT ==="
            
            # Install git, openssl (for Prisma), and other dependencies
            apk add --no-cache git openssl openssl-dev
            git clone --single-branch --branch 40/review-and-update-for-all-panel https://github.com/mahirr476/pg_admin.git .
            cd pg_admin/server
            
            echo "=== INSTALLING DEPENDENCIES ==="
            npm install
            
            echo "=== INSTALLING TYPESCRIPT GLOBALLY ==="
            npm install -g typescript
            
            echo "=== CONFIGURING STATIC FILE SERVING ==="
            # Create or update the main server file to serve static files
            cat > static-config.js << 'EOF'
            const express = require('express');
            const path = require('path');
            const cors = require('cors');

            // Add static file serving to your existing app
            module.exports = function(app) {
              // Enable CORS
              app.use(cors({
                origin: '*',
                methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS'],
                allowedHeaders: ['Content-Type', 'Authorization'],
                credentials: false
              }));

              // Serve static files from uploads directory
              app.use('/uploads', express.static(path.join(__dirname, 'uploads'), {
                setHeaders: function (res, path, stat) {
                  res.set('Access-Control-Allow-Origin', '*');
                  res.set('Access-Control-Allow-Methods', 'GET');
                  res.set('Access-Control-Allow-Headers', 'Content-Type');
                  res.set('Cache-Control', 'public, max-age=3600');
                }
              }));

              // Also serve from public directory
              app.use('/public', express.static(path.join(__dirname, 'public'), {
                setHeaders: function (res, path, stat) {
                  res.set('Access-Control-Allow-Origin', '*');
                  res.set('Access-Control-Allow-Methods', 'GET');
                  res.set('Access-Control-Allow-Headers', 'Content-Type');
                  res.set('Cache-Control', 'public, max-age=3600');
                }
              }));

              // Health check for static files
              app.get('/uploads-health', (req, res) => {
                const uploadsPath = path.join(__dirname, 'uploads');
                const fs = require('fs');
                const exists = fs.existsSync(uploadsPath);
                res.json({
                  uploadsDirectory: exists,
                  path: uploadsPath,
                  files: exists ? fs.readdirSync(uploadsPath).length : 0
                });
              });

              console.log('Static file serving configured for /uploads and /public');
            };
            EOF
            
            # Try to integrate static serving into the main app
            if [ -f "app.js" ]; then
              echo "Adding static config to app.js"
              echo "require('./static-config')(app);" >> app.js
            fi
            
            if [ -f "index.js" ]; then
              echo "Adding static config to index.js"
              echo "require('./static-config')(app);" >> index.js
            fi
            
            if [ -f "server.js" ]; then
              echo "Adding static config to server.js"
              echo "require('./static-config')(app);" >> server.js
            fi
            
            # Create uploads directory if it doesn't exist
            mkdir -p uploads/group/hero
            mkdir -p uploads/public
            
            echo "=== GENERATING PRISMA CLIENTS ==="
            if [ -f "prisma/global/schema.prisma" ]; then
              npx prisma generate --schema=./prisma/global/schema.prisma || echo "Global schema generation failed"
            fi
            if [ -f "prisma/group/schema.prisma" ]; then
              npx prisma generate --schema=./prisma/group/schema.prisma || echo "Group schema generation failed"
            fi
            if [ -f "prisma/parasole/schema.prisma" ]; then
              npx prisma generate --schema=./prisma/parasole/schema.prisma || echo "Parasole schema generation failed"
            fi
            
            echo "=== BUILDING PRODUCTION SERVER ==="
            export NODE_OPTIONS="--max-old-space-size=4096"
            npm run build || echo "Build failed, continuing with development mode"
            
            echo "=== STARTING PRODUCTION SERVER ==="
            npm start || npm run dev
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-admin-client
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-admin-client
  template:
    metadata:
      labels:
        app: pg-admin-client
    spec:
      containers:
      - name: client
        image: node:18-alpine
        workingDir: /app
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "development"
        - name: NEXT_PUBLIC_API_URL
          value: "http://api.pg-admin.57.155.183.218.nip.io"
        command: ["/bin/sh"]
        args:
          - -c
          - |
            echo "=== STARTING CLIENT DEPLOYMENT ==="
            
            apk add --no-cache git openssl openssl-dev
            git clone --single-branch --branch 40/review-and-update-for-all-panel https://github.com/mahirr476/pg_admin.git .
            cd pg_admin/client
            
            rm -f .env .env.local .env.development .env.production
            echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" > .env.local
            
            echo "=== INSTALLING CLIENT DEPENDENCIES ==="
            npm install --legacy-peer-deps
            
            echo "=== STARTING CLIENT ==="
            npm run dev -- --hostname 0.0.0.0 --port 3000
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
---
apiVersion: v1
kind: Service
metadata:
  name: pg-admin-server-service
spec:
  selector:
    app: pg-admin-server
  ports:
  - port: 7000
    targetPort: 7000
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: pg-admin-client-service
spec:
  selector:
    app: pg-admin-client
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pg-admin-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/client-max-body-size: "50m"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type"
spec:
  ingressClassName: nginx
  rules:
  - host: pg-admin.57.155.183.218.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pg-admin-client-service
            port:
              number: 80
  - host: api.pg-admin.57.155.183.218.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pg-admin-server-service
            port:
              number: 7000
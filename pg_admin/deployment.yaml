apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-admin-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-admin-server
  template:
    metadata:
      labels:
        app: pg-admin-server
    spec:
      containers:
      - name: server
        image: node:18-alpine
        workingDir: /app
        ports:
        - containerPort: 7000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "7000"
        - name: JWT_SECRET
          value: "paragon-admin-secret-production-2025"
        - name: DATABASE_URL_GLOBAL
          value: "postgresql://pgwebadmin:Pg%40Admin2025%21@pgwebpostgresql.postgres.database.azure.com:5432/globaladmin?sslmode=require"
        - name: DATABASE_URL_GROUP
          value: "postgresql://pgwebadmin:Pg%40Admin2025%21@pgwebpostgresql.postgres.database.azure.com:5432/groupdb?sslmode=require"
        - name: DATABASE_URL_PARASOLE
          value: "postgresql://pgwebadmin:Pg%40Admin2025%21@pgwebpostgresql.postgres.database.azure.com:5432/parasoledb?sslmode=require"
        command: ["/bin/sh"]
        args:
          - -c
          - |
            echo "=== STARTING PRODUCTION SERVER ==="
            
            # Install dependencies
            apk add --no-cache git openssl openssl-dev
            git clone --single-branch --branch 40/review-and-update-for-all-panel https://github.com/mahirr476/pg_admin.git .
            cd pg_admin/server
            
            echo "=== INSTALLING DEPENDENCIES ==="
            npm install
            
            echo "=== GENERATING PRISMA CLIENTS ==="
            if [ -f "prisma/global/schema.prisma" ]; then
              npx prisma generate --schema=./prisma/global/schema.prisma || echo "Global schema generation failed"
            fi
            if [ -f "prisma/group/schema.prisma" ]; then
              npx prisma generate --schema=./prisma/group/schema.prisma || echo "Group schema generation failed"
            fi
            if [ -f "prisma/parasole/schema.prisma" ]; then
              npx prisma generate --schema=./prisma/parasole/schema.prisma || echo "Parasole schema generation failed"
            fi
            
            echo "=== STARTING SERVER ==="
            npm run dev
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 7000
          initialDelaySeconds: 60
          timeoutSeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 7000
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-admin-client
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-admin-client
  template:
    metadata:
      labels:
        app: pg-admin-client
    spec:
      containers:
      - name: client
        image: node:18-alpine
        workingDir: /app
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_API_URL
          value: "http://pg-admin-server-service:7000"
        command: ["/bin/sh"]
        args:
          - -c
          - |
            echo "=== STARTING PRODUCTION CLIENT ==="
            
            # Install dependencies
            apk add --no-cache git openssl openssl-dev
            git clone --single-branch --branch 40/review-and-update-for-all-panel https://github.com/mahirr476/pg_admin.git .
            cd pg_admin/client
            
            # Remove any existing env files
            rm -f .env .env.local .env.development .env.production
            
            # Create production environment file
            echo "NEXT_PUBLIC_API_URL=http://pg-admin-server-service:7000" > .env.production
            
            echo "=== INSTALLING DEPENDENCIES ==="
            npm install --legacy-peer-deps
            
            echo "=== FIXING LOCALHOST REFERENCES ==="
            find /app/pg_admin/client -type f \( -name "*.tsx" -o -name "*.ts" -o -name "*.js" -o -name "*.jsx" \) -exec grep -l "localhost:7000" {} \; | while read file; do
              echo "Processing: $file"
              sed -i "s|http://localhost:7000|http://pg-admin-server-service:7000|g" "$file"
              sed -i "s|https://localhost:7000|http://pg-admin-server-service:7000|g" "$file"
              sed -i "s|'http://localhost:7000'|'http://pg-admin-server-service:7000'|g" "$file"
              sed -i "s|\"http://localhost:7000\"|\"http://pg-admin-server-service:7000\"|g" "$file"
            done
            
            echo "=== STARTING CLIENT ==="
            npm run dev
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 60
          timeoutSeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: pg-admin-client-service
spec:
  selector:
    app: pg-admin-client
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer
  loadBalancerIP: "4.144.195.246"

---
apiVersion: v1
kind: Service
metadata:
  name: pg-admin-server-service
spec:
  selector:
    app: pg-admin-server
  ports:
  - port: 7000
    targetPort: 7000
  type: LoadBalancer
  loadBalancerIP: "20.212.138.160"
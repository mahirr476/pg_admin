apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-admin-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-admin-server
  template:
    metadata:
      labels:
        app: pg-admin-server
    spec:
      containers:
      - name: server
        image: node:18-alpine
        workingDir: /app
        ports:
        - containerPort: 7000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "7000"
        - name: JWT_SECRET
          value: "paragon-admin-secret-production-2025"
        - name: DATABASE_URL_GLOBAL
          value: "postgresql://pgwebadmin:Pg%40Admin2025%21@pgwebpostgresql.postgres.database.azure.com:5432/globaladmin?sslmode=require"
        - name: DATABASE_URL_GROUP
          value: "postgresql://pgwebadmin:Pg%40Admin2025%21@pgwebpostgresql.postgres.database.azure.com:5432/groupdb?sslmode=require"
        - name: DATABASE_URL_PARASOLE
          value: "postgresql://pgwebadmin:Pg%40Admin2025%21@pgwebpostgresql.postgres.database.azure.com:5432/parasoledb?sslmode=require"
        command: ["/bin/sh", "-c"]
        args:
          - |
            apk add --no-cache git openssl openssl-dev
            git clone --single-branch --branch 40/review-and-update-for-all-panel https://github.com/mahirr476/pg_admin.git .
            cd pg_admin/server
            
            # Install ALL dependencies including dev dependencies (nodemon is in devDependencies)
            npm install --include=dev
            
            # Generate Prisma clients
            if [ -f "prisma/global/schema.prisma" ]; then
              npx prisma generate --schema=./prisma/global/schema.prisma
            fi
            if [ -f "prisma/group/schema.prisma" ]; then
              npx prisma generate --schema=./prisma/group/schema.prisma
            fi
            if [ -f "prisma/parasole/schema.prisma" ]; then
              npx prisma generate --schema=./prisma/parasole/schema.prisma
            fi
            
            # Start the server (now nodemon will be available)
            npm run dev
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-admin-client
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-admin-client
  template:
    metadata:
      labels:
        app: pg-admin-client
    spec:
      containers:
      - name: client
        image: node:18-alpine
        workingDir: /app
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_API_URL
          value: "http://pg-admin-server-service:7000"
        - name: NEXT_TELEMETRY_DISABLED
          value: "1"
        command: ["/bin/sh", "-c"]
        args:
          - |
            apk add --no-cache git openssl openssl-dev
            git clone --single-branch --branch 40/review-and-update-for-all-panel https://github.com/mahirr476/pg_admin.git .
            cd pg_admin/client
            
            # Create environment file
            echo "NEXT_PUBLIC_API_URL=http://pg-admin-server-service:7000" > .env.production
            echo "NEXT_TELEMETRY_DISABLED=1" >> .env.production
            
            # Install dependencies with legacy peer deps to handle React version conflicts
            npm install --legacy-peer-deps
            
            # Pre-install TypeScript dependencies to prevent Next.js auto-install
            npm install --save-dev typescript @types/react @types/node --legacy-peer-deps
            
            # Set npm config to always use legacy peer deps for this session
            npm config set legacy-peer-deps true
            
            # Fix localhost references
            find . -type f \( -name "*.tsx" -o -name "*.ts" -o -name "*.js" -o -name "*.jsx" \) -exec grep -l "localhost:7000" {} \; | while read file; do
              sed -i "s|http://localhost:7000|http://pg-admin-server-service:7000|g" "$file"
              sed -i "s|https://localhost:7000|http://pg-admin-server-service:7000|g" "$file"
            done
            
            # Start the client
            npm run dev
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

---
apiVersion: v1
kind: Service
metadata:
  name: pg-admin-client-service
spec:
  selector:
    app: pg-admin-client
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer
  loadBalancerIP: "4.144.195.246"

---
apiVersion: v1
kind: Service
metadata:
  name: pg-admin-server-service
spec:
  selector:
    app: pg-admin-server
  ports:
  - port: 7000
    targetPort: 7000
  type: LoadBalancer
  loadBalancerIP: "20.212.138.160"
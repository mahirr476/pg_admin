# Fixed Production Kubernetes Deployment
apiVersion: v1
kind: Namespace
metadata:
  name: pg-admin-prod
  labels:
    environment: production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-admin-config
  namespace: pg-admin-prod
data:
  NODE_ENV: "production"
  SERVER_PORT: "7000"
  CLIENT_PORT: "3000"
  NEXT_PUBLIC_API_URL: "http://20.24.179.158:7000"  # Your new server IP
---

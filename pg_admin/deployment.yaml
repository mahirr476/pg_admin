apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-admin-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-admin-server
  template:
    metadata:
      labels:
        app: pg-admin-server
    spec:
      containers:
      - name: server
        image: node:18-alpine
        workingDir: /app
        ports:
        - containerPort: 7000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "7000"
        - name: JWT_SECRET
          value: "paragon-admin-secret-production-2025"
        - name: DATABASE_URL_GLOBAL
          value: "postgresql://pgwebadmin:Pg%40Admin2025%21@pgwebpostgresql.postgres.database.azure.com:5432/globaladmin?sslmode=require"
        - name: DATABASE_URL_GROUP
          value: "postgresql://pgwebadmin:Pg%40Admin2025%21@pgwebpostgresql.postgres.database.azure.com:5432/groupdb?sslmode=require"
        - name: DATABASE_URL_PARASOLE
          value: "postgresql://pgwebadmin:Pg%40Admin2025%21@pgwebpostgresql.postgres.database.azure.com:5432/parasoledb?sslmode=require"
        command: ["/bin/sh"]
        args:
          - -c
          - |
            echo "Starting server..."
            apk add --no-cache git openssl openssl-dev
            git clone --single-branch --branch 40/review-and-update-for-all-panel https://github.com/mahirr476/pg_admin.git .
            cd pg_admin/server
            npm install --include=dev
            if [ -f "prisma/global/schema.prisma" ]; then
              npx prisma generate --schema=./prisma/global/schema.prisma || echo "Global failed"
            fi
            if [ -f "prisma/group/schema.prisma" ]; then
              npx prisma generate --schema=./prisma/group/schema.prisma || echo "Group failed"
            fi
            if [ -f "prisma/parasole/schema.prisma" ]; then
              npx prisma generate --schema=./prisma/parasole/schema.prisma || echo "Parasole failed"
            fi
            npm run dev
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-admin-client
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-admin-client
  template:
    metadata:
      labels:
        app: pg-admin-client
    spec:
      containers:
      - name: client
        image: node:18-alpine
        workingDir: /app
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "development"
        - name: NEXT_PUBLIC_API_URL
          value: "http://pg-admin-server-service:7000"
        - name: NEXT_TELEMETRY_DISABLED
          value: "1"
        command: ["/bin/sh"]
        args:
          - -c
          - |
            echo "Starting client..."
            apk add --no-cache git openssl openssl-dev
            git clone --single-branch --branch 40/review-and-update-for-all-panel https://github.com/mahirr476/pg_admin.git .
            cd pg_admin/client
            echo "NEXT_PUBLIC_API_URL=http://pg-admin-server-service:7000" > .env.development
            echo "NEXT_TELEMETRY_DISABLED=1" >> .env.development
            npm config set legacy-peer-deps true
            npm install --legacy-peer-deps
            npm install --save-dev typescript @types/react @types/node --legacy-peer-deps
            find . -name "*.tsx" -o -name "*.ts" -o -name "*.js" -o -name "*.jsx" | xargs grep -l "localhost:7000" | xargs sed -i 's|localhost:7000|pg-admin-server-service:7000|g' 2>/dev/null || true
            npm run dev
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

---
apiVersion: v1
kind: Service
metadata:
  name: pg-admin-client-service
spec:
  selector:
    app: pg-admin-client
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer
  loadBalancerIP: "4.144.195.246"

---
apiVersion: v1
kind: Service
metadata:
  name: pg-admin-server-service
spec:
  selector:
    app: pg-admin-server
  ports:
  - port: 7000
    targetPort: 7000
  type: LoadBalancer
  loadBalancerIP: "20.212.138.160"
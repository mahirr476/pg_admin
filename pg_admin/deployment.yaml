    metadata:
      labels:
        app: pg-admin-server
    spec:
      # Add single volume for persistent storage
      volumes:
      - name: uploads-volume
        persistentVolumeClaim:
          claimName: pg-admin-uploads-pvc
      containers:
      - name: server
        image: node:18-alpine
        workingDir: /app
        ports:
        - containerPort: 7000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "7000"
        - name: JWT_SECRET
          value: "paragon-admin-secret"
        - name: DATABASE_URL_GLOBAL
          value: "postgresql://pgwebadmin:Pg%40Admin2025%21@pgwebpostgresql.postgres.database.azure.com:5432/globaladmin?sslmode=require"
        - name: DATABASE_URL_GROUP
          value: "postgresql://pgwebadmin:Pg%40Admin2025%21@pgwebpostgresql.postgres.database.azure.com:5432/groupdb?sslmode=require"
        - name: DATABASE_URL_PARASOLE
          value: "postgresql://pgwebadmin:G%40Admin2025%21@pgwebpostgresql.postgres.database.azure.com:5432/parasoledb?sslmode=require"
        # Auto-update settings (NEW)
        - name: UPDATE_CHECK_INTERVAL
          value: "60"  # Check every 60 seconds
        - name: ENABLE_AUTO_UPDATE
          value: "true"  # Set to "false" to disable
        # Mount only the uploads directory
        volumeMounts:
        - name: uploads-volume
          mountPath: /app/pg_admin/server/public/uploads
        command: ["/bin/sh"]
        args:
          - -c
          - |
            echo "=== STARTING SERVER WITH AUTO-UPDATE ==="
            
            # Install git, openssl, curl for auto-updates
            apk add --no-cache git openssl openssl-dev curl
            
            # Auto-update check function
            check_for_updates() {
              echo "$(date): Checking for updates..."
              
              REPO_API="https://api.github.com/repos/mahirr476/pg_admin/branches/40/review-and-update-for-all-panel"
              NEW_COMMIT=$(curl -s "$REPO_API" | grep '"sha"' | head -1 | cut -d'"' -f4 2>/dev/null)
              
              if [ -z "$NEW_COMMIT" ]; then
                echo "Warning: Could not fetch latest commit info"
                return 1
              fi
              
              if [ -f "/app/.current_commit" ]; then
                CURRENT_COMMIT=$(cat /app/.current_commit)
              else
                CURRENT_COMMIT="none"
              fi
              
              if [ "$CURRENT_COMMIT" != "$NEW_COMMIT" ]; then
                echo "New changes detected!"
                echo "Current: $CURRENT_COMMIT"
                echo "New: $NEW_COMMIT"
                return 0
              else
                echo "No changes detected"
                return 1
              fi
            }
            
            # Setup function (your original code)
            setup_server() {
              echo "=== DOWNLOADING CODE ==="
              # Clone to a temporary directory first, then move
              git clone --single-branch --branch 40/review-and-update-for-all-panel https://github.com/mahirr476/pg_admin.git /tmp/pg_admin
              cd /tmp/pg_admin
              git rev-parse HEAD > /app/.current_commit
              cd /app
              rm -rf pg_admin_backup
              mv pg_admin pg_admin_backup 2>/dev/null || true
              cp -r /tmp/pg_admin/* .
              rm -rf /tmp/pg_admin
              cd pg_admin/server
              
              echo "=== INSTALLING DEPENDENCIES ==="
              npm install
              
              echo "=== INSTALLING TYPESCRIPT GLOBALLY ==="
              npm install -g typescript
              
              echo "=== CHECKING PERSISTENT STORAGE ==="
              ls -la /app/pg_admin/server/public/
              echo "Upload directory contents:"
              ls -la /app/pg_admin/server/public/uploads/ 2>/dev/null || echo "No uploads yet"
              
              echo "=== CREATING BASE UPLOAD DIRECTORIES ==="
              # Only create the main directories - subfolders will be created dynamically
              mkdir -p /app/pg_admin/server/public/uploads/group
              mkdir -p /app/pg_admin/server/public/uploads/parasole
              
              echo "=== SETTING PROPER PERMISSIONS ==="
              # Set proper permissions for the mounted volumes
              chmod -R 755 /app/pg_admin/server/public
              chmod -R 777 /app/pg_admin/server/public/uploads
              
              echo "=== FINAL DIRECTORY CHECK ==="
              echo "Files in uploads after setup:"
              find /app/pg_admin/server/public/uploads -type f 2>/dev/null | head -10 || echo "No files found"
              
              echo "=== GENERATING PRISMA CLIENTS ==="
              # Generate Prisma clients (skip migrations to avoid DB connection issues)
              if [ -f "prisma/global/schema.prisma" ]; then
                npx prisma generate --schema=./prisma/global/schema.prisma || echo "Global schema generation failed"
              fi
              if [ -f "prisma/group/schema.prisma" ]; then
                npx prisma generate --schema=./prisma/group/schema.prisma || echo "Group schema generation failed"
              fi
              if [ -f "prisma/parasole/schema.prisma" ]; then
                npx prisma generate --schema=./prisma/parasole/schema.prisma || echo "Parasole schema generation failed"
              fi
              
              echo "=== BUILDING PRODUCTION SERVER ==="
              # Set Node options for better memory handling  
              export NODE_OPTIONS="--max-old-space-size=4096"
              npm run build
            }
            
            start_server() {
              cd /app/pg_admin/server
              echo "=== STARTING PRODUCTION SERVER ==="
              echo "Upload files before starting server:"
              find /app/pg_admin/server/public/uploads -name "*.jpg" -o -name "*.png" -o -name "*.jpeg" 2>/dev/null | wc -l || echo "0"
              npm start
            }
            
            # Initial setup
            setup_server
            
            # Main auto-update loop
            while true; do
              echo "=== STARTING SERVER (PID will be tracked) ==="
              
              # Start server in background
              start_server &
              SERVER_PID=$!
              echo "Server started with PID: $SERVER_PID"
              
              # Monitor loop
              LAST_CHECK=0
              while true; do
                # Check if server is still running
                if ! kill -0 $SERVER_PID 2>/dev/null; then
                  echo "Server process died, will restart"
                  break
                fi
                
                # Check for updates only if enabled and interval passed
                CURRENT_TIME=$(date +%s)
                if [ "$ENABLE_AUTO_UPDATE" = "true" ] && [ $((CURRENT_TIME - LAST_CHECK)) -gt $UPDATE_CHECK_INTERVAL ]; then
                  LAST_CHECK=$CURRENT_TIME
                  
                  if check_for_updates; then
                    echo "=== GRACEFULLY STOPPING SERVER FOR UPDATE ==="
                    
                    # Try graceful shutdown first
                    kill -TERM $SERVER_PID 2>/dev/null || true
                    
                    # Wait up to 30 seconds for graceful shutdown
                    for i in $(seq 1 30); do
                      if ! kill -0 $SERVER_PID 2>/dev/null; then
                        echo "Server stopped gracefully"
                        break
                      fi
                      sleep 1
                    done
                    
                    # Force kill if still running
                    kill -KILL $SERVER_PID 2>/dev/null || true
                    wait $SERVER_PID 2>/dev/null || true
                    
                    # Update and restart
                    if setup_server; then
                      echo "Update completed, server will restart"
                      break
                    else
                      echo "Update failed, server will restart with old code"
                      break
                    fi
                  fi
                fi
                
                # Sleep for 10 seconds before next check
                sleep 10
              done
              
              # Clean up process
              wait $SERVER_PID 2>/dev/null || true
              echo "Restarting server in 5 seconds..."
              sleep 5
            done
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-admin-client
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-admin-client
  template:
    metadata:
      labels:
        app: pg-admin-client
    spec:
      containers:
      - name: client
        image: node:18-alpine
        workingDir: /app
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "development"
        - name: NEXT_PUBLIC_API_URL
          value: "http://api.pg-admin.57.155.183.218.nip.io"  # Use Ingress IP
        command: ["/bin/sh"]
        args:
          - -c
          - |
            echo "=== STARTING CLIENT DEPLOYMENT ==="
            
            # Install git, openssl (for Prisma), and other dependencies  
            apk add --no-cache git openssl openssl-dev
            git clone --single-branch --branch 40/review-and-update-for-all-panel https://github.com/mahirr476/pg_admin.git .
            cd pg_admin/client
            
            # IMPORTANT: Remove any .env files that might override our settings
            rm -f .env .env.local .env.development .env.production
            
            # Create a new .env.local file with our environment variable
            echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" > .env.local
            
            echo "=== CHECKING ENVIRONMENT ==="
            echo "NEXT_PUBLIC_API_URL is set to: $NEXT_PUBLIC_API_URL"
            cat .env.local
            
            echo "=== INSTALLING CLIENT DEPENDENCIES ==="
            npm install --legacy-peer-deps
            
            echo "=== FIXING HARDCODED LOCALHOST IN ALL FILES ==="
            # More comprehensive localhost replacement
            find /app/pg_admin/client -type f \( -name "*.tsx" -o -name "*.ts" -o -name "*.js" -o -name "*.jsx" \) -exec grep -l "localhost:7000\|localhost:3000" {} \; | while read file; do
              echo "Processing: $file"
              # Replace server API calls (localhost:7000)
              sed -i "s|http://localhost:7000|${NEXT_PUBLIC_API_URL}|g" "$file"
              sed -i "s|https://localhost:7000|${NEXT_PUBLIC_API_URL}|g" "$file"
              sed -i "s|'http://localhost:7000'|'${NEXT_PUBLIC_API_URL}'|g" "$file"
              sed -i "s|\"http://localhost:7000\"|\"${NEXT_PUBLIC_API_URL}\"|g" "$file"
              # Also handle cases without http://
              sed -i "s|'localhost:7000'|'${NEXT_PUBLIC_API_URL#http://}'|g" "$file"
              sed -i "s|\"localhost:7000\"|\"${NEXT_PUBLIC_API_URL#http://}\"|g" "$file"
            done
            
            echo "=== Verifying replacement ==="
            echo "Files still containing localhost:7000:"
            grep -r "localhost:7000" /app/pg_admin/client --include="*.tsx" --include="*.ts" --include="*.js" --include="*.jsx" || echo "None found - replacement successful!"
            
            echo "=== STARTING CLIENT IN DEV MODE ==="
            npm run dev -- --hostname 0.0.0.0 --port 3000
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
---
apiVersion: v1
kind: Service
metadata:
  name: pg-admin-server-service
spec:
  selector:
    app: pg-admin-server
  ports:
  - port: 7000
    targetPort: 7000
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: pg-admin-client-service
spec:
  selector:
    app: pg-admin-client
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pg-admin-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: pg-admin.57.155.183.218.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pg-admin-client-service
            port:
              number: 80
  - host: api.pg-admin.57.155.183.218.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pg-admin-server-service
            port:
              number: 7000


              


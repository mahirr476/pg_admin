services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL_GLOBAL: ${DATABASE_URL_GLOBAL}
      DATABASE_URL_GROUP: ${DATABASE_URL_GROUP}
      DATABASE_URL_PARASOLE: ${DATABASE_URL_PARASOLE}
      PORT: 7000
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "7000:7000"
    volumes:
      - ./server/src:/app/src:delegated
      - ./server/prisma:/app/prisma:delegated
      - ./server/package.json:/app/package.json:delegated
      - ./server/tsconfig.json:/app/tsconfig.json:delegated
      - ./server/nodemon.json:/app/nodemon.json:delegated
      - ./server/public:/app/public:delegated
    command: >
      sh -c "
             # Generate Prisma clients
             npx prisma generate --schema=./prisma/global/schema.prisma &&
             npx prisma migrate deploy --schema=./prisma/global/schema.prisma &&
             
             npx prisma generate --schema=./prisma/group/schema.prisma &&
             npx prisma migrate deploy --schema=./prisma/group/schema.prisma &&

             npx prisma generate --schema=./prisma/parasole/schema.prisma &&
             npx prisma migrate deploy --schema=./prisma/parasole/schema.prisma &&
             
             # Install missing dependency
             npm install object-assign &&
             
             # Start the development server
             npm run dev"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"  # This allows Docker to connect to your host machine
  
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app:cached
      - /app/node_modules
      - /app/.next
    depends_on:
      - server
    environment:
      NODE_ENV: development
      REACT_APP_API_URL: http://server:7000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      NEXT_TURBO_POLL_INTERVAL: "1000"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_WEBPACK_USEPOLLING: "1"
    restart: unless-stopped
    command: npm run dev
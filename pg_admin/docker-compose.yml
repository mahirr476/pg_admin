services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: globaladmin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d globaladmin"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://admin:adminpass@postgres:5432/globaladmin?schema=public
      DATABASE_URL_GLOBAL: postgresql://admin:adminpass@postgres:5432/globaladmin?schema=public
      PORT: 7000
      JWT_SECRET: paragon-admin-secret
    ports:
      - "7000:7000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server/prisma:/app/prisma
    networks:
      - app-network
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    environment:
      NODE_ENV: development
      REACT_APP_API_URL: http://server:7000
    networks:
      - app-network
volumes:
  postgres_data:
networks:
  app-network:
    driver: bridge
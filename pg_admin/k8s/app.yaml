# Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
      - name: server
        image: node:18-alpine
        ports:
        - containerPort: 7000
        env:
        - name: DATABASE_URL_GLOBAL
          value: "postgresql://pgwebadmin:pg%40webadmin25@pgwebpostgresql.postgres.database.azure.com:5432/globaladmin?sslmode=require"
        - name: DATABASE_URL_GROUP
          value: "postgresql://pgwebadmin:pg%40webadmin25@pgwebpostgresql.postgres.database.azure.com:5432/groupdb?sslmode=require"
        - name: DATABASE_URL_PARASOLE
          value: "postgresql://pgwebadmin:pg%40webadmin25@pgwebpostgresql.postgres.database.azure.com:5432/parasoledb?sslmode=require"
        - name: JWT_SECRET
          value: "paragon-admin-secret"
        - name: PORT
          value: "7000"
        command: ["/bin/sh"]
        args: ["-c", "apk add --no-cache git && git clone --single-branch --branch 40/review-and-update-for-all-panel https://github.com/mahirr476/pg_admin.git /app && cd /app/server && npm install && npm run dev"]
---
# Server Service
apiVersion: v1
kind: Service
metadata:
  name: server-service
spec:
  selector:
    app: server
  ports:
  - port: 7000
    targetPort: 7000
  type: ClusterIP
---
# Client Deployment  
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
      - name: client
        image: node:18-alpine
        ports:
        - containerPort: 3000
        env:
        - name: REACT_APP_API_URL
          value: "http://server-service:7000"
        command: ["/bin/sh"]
        args: ["-c", "apk add --no-cache git && git clone --single-branch --branch 40/review-and-update-for-all-panel https://github.com/mahirr476/pg_admin.git /app && cd /app/client && npm install --legacy-peer-deps && npm run dev"]
---
# Client Service (LoadBalancer for external access)
apiVersion: v1
kind: Service
metadata:
  name: client-service
spec:
  selector:
    app: client
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer



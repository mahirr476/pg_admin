apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pg-admin-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/client-max-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/client-body-buffer-size: "1m"
    
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
      }
     
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - pg-admin.57.155.183.218.nip.io
    - api.pg-admin.57.155.183.218.nip.io
    secretName: pg-admin-tls-secret
  - hosts:
    - parasolefootwear.com
    - www.parasolefootwear.com
    secretName: parasole-tls-secret
  - hosts:
    - paragongroup-bd.com
    - www.paragongroup-bd.com
    secretName: paragon-tls-secret
  rules:
  - host: pg-admin.57.155.183.218.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pg-admin-client-service
            port:
              number: 80
  - host: api.pg-admin.57.155.183.218.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pg-admin-server-service
            port:
              number: 7000
  - host: parasolefootwear.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pg-admin-server-service
            port:
              number: 7000
  - host: www.parasolefootwear.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pg-admin-server-service
            port:
              number: 7000
  - host: paragongroup-bd.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pg-admin-server-service
            port:
              number: 7000
  - host: www.paragongroup-bd.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pg-admin-server-service
            port:
              number: 7000